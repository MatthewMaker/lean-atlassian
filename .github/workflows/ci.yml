name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes any run still in flight for it. Runs on main
# aren't cancelled: the release job must not stop between tag and release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: Hook script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck plugins/*/hooks/*.sh tests/*.sh

      - name: Parse check
        run: |
          for f in plugins/*/hooks/*.sh tests/*.sh; do bash -n "$f"; done

      # The hooks are the only executable code here, and they fail quietly: a
      # bad emission reaches every session of every install.
      - name: Cascade and emission tests
        run: tests/hook-cascade.sh

      - name: One-time offer tests
        run: tests/offers.sh

      # This hook grants permission, so pin what it must never approve.
      - name: Operation approval tests
        run: tests/approve-operations.sh

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Schema validation. Runs unauthenticated.
      - name: claude plugin validate
        run: claude plugin validate .

      # Repo-specific invariants the schema can't express — above all that the
      # version is declared exactly once.
      - name: Manifest invariants
        run: tests/manifest-invariants.sh

  # Tags and releases the version in plugin.json once checks pass on main.
  # A version that's already tagged is left alone, so ordinary merges are
  # no-ops. Manifest invariants guarantee the CHANGELOG has a matching section.
  release:
    name: Release
    needs: [shell, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag and release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version plugins/lean-atlassian/.claude-plugin/plugin.json)"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          awk -v h="## [$version]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md
